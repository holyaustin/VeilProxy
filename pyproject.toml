[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veilproxy"
version = "0.1.0"
description = "VeilProxy + ShardKey: a local secrets-redacting gateway for OpenAI-compatible LLM APIs (OmniRoute) with Shamir-protected key custody"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "cryptography>=42",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "textual>=0.80",
  "rich>=13",
]

[project.optional-dependencies]
nlp = ["presidio-analyzer>=2.2", "spacy>=3.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6"]

[project.scripts]
veil = "veil.cli:main"

[tool.setuptools.packages.find]
include = ["veil*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
