<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#14233b"/>
      <stop offset="100%" stop-color="#070d18"/>
    </radialGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- shield (the veil) -->
  <path d="M600 112 L742 166 V298 C742 392 676 450 600 486 C524 450 458 392 458 298 V166 Z"
        fill="url(#veil)" stroke="#22d3ee" stroke-width="10" stroke-linejoin="round"/>
  <!-- veil folds -->
  <path d="M478 214 C540 246 660 246 722 214" fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>
  <path d="M478 246 C540 278 660 278 722 246" fill="none" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="4" stroke-linecap="round"/>

  <!-- key -->
  <g fill="none" stroke="#f5b942" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="600" cy="262" r="40"/>
    <circle cx="600" cy="262" r="9" fill="#f5b942" stroke="none"/>
    <line x1="600" y1="302" x2="600" y2="410"/>
    <line x1="600" y1="364" x2="636" y2="364"/>
    <line x1="600" y1="392" x2="626" y2="392"/>
  </g>

  <!-- wordmark (positioned explicitly so it renders identically everywhere) -->
  <text x="360.3" y="618" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="700" fill="#e8eef7">Veil</text>
  <text x="549.9" y="618" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="700" fill="#22d3ee">Proxy</text>
  <text x="450.9" y="676" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="500" letter-spacing="9" fill="#f5b942">+ SHARDKEY</text>

  <!-- 3-of-5 threshold dots -->
  <g transform="translate(0,722)">
    <circle cx="540" cy="0" r="9" fill="#f5b942"/>
    <circle cx="570" cy="0" r="9" fill="#f5b942"/>
    <circle cx="600" cy="0" r="9" fill="#f5b942"/>
    <circle cx="630" cy="0" r="8" fill="none" stroke="#f5b942" stroke-width="3" stroke-opacity="0.6"/>
    <circle cx="660" cy="0" r="8" fill="none" stroke="#f5b942" stroke-width="3" stroke-opacity="0.6"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
